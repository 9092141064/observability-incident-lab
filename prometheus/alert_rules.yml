groups:
  - name: service-availability-and-latency
    rules:
      - alert: AppEndpointDown
        expr: probe_success{job="blackbox-http"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Application HTTP health probe failing"
          description: "Blackbox HTTP probe for {{ $labels.instance }} has failed for more than 30s."

      - alert: DatabasePortUnreachable
        expr: probe_success{job="blackbox-tcp"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Database TCP port unreachable"
          description: "TCP probe to {{ $labels.instance }} failed for more than 30s."

      - alert: HighEndpointLatency
        expr: probe_duration_seconds{job="blackbox-http"} > 1.0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High HTTP probe latency detected"
          description: "Probe duration for {{ $labels.instance }} is {{ $value }}s (> 1.0s for 1m)."
